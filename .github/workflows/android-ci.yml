
name: STUDY MASTERY - Android CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-mastery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace \
            :app:clean \
            :app:assembleDebug \
            :app:testDebugUnitTest

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-mastery-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STUDY-MASTERY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
